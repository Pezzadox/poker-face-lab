# Poker Face Lab — builds a signed Android app bundle.
#
# Run it from the Actions tab (Release → Run workflow) with a version such as 1.0.0.
# The bundle is kept as a run artifact and put on the play-bundles branch, so it can be
# added to Play Console straight from GitHub.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 1.0.0'
        required: true

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }

      - name: Version
        id: v
        run: |
          NAME="${{ github.event.inputs.version }}"
          [ -z "$NAME" ] && NAME="${GITHUB_REF_NAME#v}"
          echo "name=$NAME" >> $GITHUB_OUTPUT
          # build number: minutes since 2026-01-01, always increasing, never reused
          echo "code=$(( ( $(date +%s) - 1767225600 ) / 60 ))" >> $GITHUB_OUTPUT

      - name: Is the signing key set?
        id: gate
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then echo "ready=yes" >> $GITHUB_OUTPUT
          else echo "ready=no" >> $GITHUB_OUTPUT; echo "::error::Android signing key not set. Run make-more-android-keys.ps1 first."; exit 1; fi

      - run: npm ci && npx cap sync android

      - name: Unpack the signing key
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build the app bundle
        working-directory: android
        run: |
          ./gradlew bundleRelease --no-daemon \
            -PvName=${{ steps.v.outputs.name }} \
            -PvCode=${{ steps.v.outputs.code }} \
            -PstoreFileProp="$RUNNER_TEMP/release.keystore" \
            -PstorePasswordProp='${{ secrets.ANDROID_KEYSTORE_PASSWORD }}' \
            -PkeyAliasProp='${{ secrets.ANDROID_KEY_ALIAS }}' \
            -PkeyPasswordProp='${{ secrets.ANDROID_KEY_PASSWORD }}'

      - name: Keep a copy of the bundle
        uses: actions/upload-artifact@v4
        with:
          name: poker-face-lab-${{ steps.v.outputs.name }}.aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Put the bundle on the play-bundles branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/play-bundles"; mkdir -p "$out"
          cp android/app/build/outputs/bundle/release/app-release.aab "$out/poker-face-lab-${{ steps.v.outputs.name }}.aab"
          cp android/app/build/outputs/bundle/release/app-release.aab "$out/latest.aab"
          cd "$out"
          git init -q -b play-bundles
          git add .
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -qm "Android bundle ${{ steps.v.outputs.name }}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" play-bundles
